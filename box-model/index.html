<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>box model</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>


        <!-- Block elements will take up 100% of the width of their container and will stack vertically on top of one another -->
        <div class="block">block</div>
        <div class="block">block</div>
        <div class="block">block</div>

        <!-- inline elements only take up as much space as the content requires and will nest horizontally next to one another if there is enough space to do so-->
        <span class="inline">inline</span>
        <span class="inline">inline</span>
        <span class="inline">inline</span>
        <span class="inline">inline</span>
        <span class="inline">inline</span>
        

        <!-- inline-block combines qualities of both block and inline, allowing us to add width,height,padding, and margin to inline elements. -->
        <span class="inline-block">inline-block</span>
        <span class="inline-block">inline-block</span>
        <span class="inline-block">inline-block</span>
        <span class="inline-block">inline-block</span>


        <div class="content-box">content-box</div>

        <div class="border-box">border-box</div>


    </body>

</html>
