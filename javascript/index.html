<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SATURDAY SATURDAY SATURDAY</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>

        <button onclick="change()">Click me...</button>
        <button onclick="glow()">Glow</button>
        <div class="menu">
            Catch me floating circles in ma <span class="yellow">
            fish bowl</span>
    
        </div>

        <div class="gear">
        <img src="Trash_The_Dragon.webp" width="250px">
        </div>

        <script>
            var menu = document.querySelector(".menu");
            var gear = document.querySelector(".gear");

            function change() {
                console.log('it works!');
                menu.classList.toggle("active");
                gear.classList.toggle("spin");
                document.body.classList.toggle("dark");
                }

            function glow() {
                console.log('catch me floating circles in ma fish bowl!');
                gear.classList.toggle("glow");
                menu.classList.toggle("glow");
            }
        </script>

    </body>

</html>
